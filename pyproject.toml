[project]
name = "stickman-pipeline"
version = "0.1.0"
description = "Topic -> story -> shots -> voiceover -> stickman video (Claude + ElevenLabs + Remotion)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "elevenlabs",
    "mutagen>=1.48.1",
    "pydantic>=2",
    "python-dotenv",
]

[project.scripts]
stickman = "pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
